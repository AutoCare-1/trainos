# Config do Railway pro backend. Ao criar o serviço no Railway, aponte o
# "Root Directory" pra `backend-laravel` (é um monorepo) — daí ele encontra
# este arquivo e o Dockerfile sozinho.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
