# Só o build. O deploy (healthcheck, restart) é decidido em
# .railway/railway.ts, na raiz do repositório.
#
# Ter healthcheckTimeout nos dois arquivos, com valores diferentes, é o tipo de
# coisa que funciona até o dia em que o outro arquivo vence — e aí o deploy
# morre com "healthcheck failed" e nada aponta pra causa.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
