name: CI

on:
  push:
  pull_request:

# Só pra CI — nunca usado em produção de verdade (lá o segredo vem de variável
# de ambiente real). Precisa ter pelo menos 32 bytes (o pacote JWT do Laravel valida isso).
env:
  CI_JWT_SECRET: ci-only-secret-nao-usar-em-producao-0123456789abcdef

jobs:
  backend:
    name: Backend (PHPUnit contra MySQL real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-laravel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trainos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, exif, gd, zip
          coverage: none

      - name: Instalar dependências (composer)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes (PHPUnit contra o serviço MySQL acima)
        env:
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
        # `php artisan test` (o wrapper do Laravel) passou a devolver exit
        # code 1 mesmo com a suíte inteira passando, depois que o
        # laravel/framework foi de v12.64.0 pra v12.69.1 (01/09/2026,
        # `composer update` do fix de plataforma do PHP). Confirmado local:
        # vendor/bin/phpunit sempre acerta o código de saída nos dois
        # sentidos (0 quando passa, 1 quando falha de verdade); o wrapper
        # do artisan, não. Chamando o binário direto até isso ser
        # investigado a fundo ou corrigido por uma versão nova do Laravel.
        run: vendor/bin/phpunit --configuration=phpunit.ci.xml

  docker-build:
    name: Backend builda no Docker (mesma imagem do Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (sem publicar — só confirma que builda)
        uses: docker/build-push-action@v6
        with:
          context: backend-laravel
          push: false

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (npm)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Política de cache do Service Worker (o que pode funcionar offline e,
      # principalmente, o que nunca entra em cache — vídeo e mídia de usuário).
      # Runner nativo do Node, sem dependência nova.
      - name: Testes do Service Worker
        run: npm run test:sw

      - name: Build de produção
        run: npm run build
